name: Auto release Obsidian plugin

on:
  # 仅插件发布相关文件进入 main 时自动发布，文档修改不会制造无意义版本。
  push:
    branches:
      - main
    paths:
      - main.js
      - styles.css
      - manifest.json
      - package.json
      - package-lock.json
      - versions.json
  # 保留手工触发入口，用于需要重新执行发布流程的场景。
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

# 多次连续推送时按顺序发布，防止两个任务同时计算出相同版本号。
concurrency:
  group: obsidian-plugin-release
  cancel-in-progress: false

jobs:
  release:
    # Actions 机器人提交版本文件后不再重复进入发布流程。
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare release version
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(node -p "require('./manifest.json').version")"

          # 版本对应的标签或 Release 已存在时，说明这是一次新的代码推送，
          # 自动递增补丁版本；若开发者已手工填写新版本，则直接使用该版本。
          if git show-ref --tags --verify --quiet "refs/tags/${current_version}" \
            || gh release view "${current_version}" >/dev/null 2>&1; then
            node scripts/prepare-release.mjs --bump-patch
          else
            node scripts/prepare-release.mjs --sync-manifest
          fi

          version="$(node -p "require('./manifest.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and validate plugin
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --check main.js
          git diff --check

          test -s main.js
          test -s manifest.json
          test -s styles.css

          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));

          const expected = manifest.version;
          const checks = {
            'package.json': pkg.version,
            'package-lock.json': lock.version,
            'package-lock root package': lock.packages?.['']?.version,
          };

          for (const [file, actual] of Object.entries(checks)) {
            if (actual !== expected) {
              throw new Error(`${file} version ${actual} does not match manifest ${expected}`);
            }
          }

          if (versions[expected] !== manifest.minAppVersion) {
            throw new Error(`versions.json is missing ${expected} -> ${manifest.minAppVersion}`);
          }
          NODE

      - name: Commit synchronized version files
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.prepare.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json package-lock.json versions.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare release ${version} [skip release]"
            git push origin HEAD:main
          fi

          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.version }}
          target_commitish: ${{ steps.commit.outputs.commit_sha }}
          name: ${{ steps.prepare.outputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css

      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
